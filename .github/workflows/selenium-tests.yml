name: Selenium Pytest Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  selenium-tests:
    name: Chrome Selenium Tests
    runs-on: windows-latest

    steps:

      # ============================================================
      # 01 - CHECKOUT
      # ============================================================
      - name: "01 - Checkout repository"
        uses: actions/checkout@v4

      # ============================================================
      # 02 - PYTHON + PIP CACHE
      # ============================================================
      - name: "02 - Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # ============================================================
      # 03 - INSTALL GOOGLE CHROME
      # ============================================================
      - name: "03 - Install Google Chrome"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " GOOGLE CHROME"
          Write-Host "============================================================"
          Write-Host ""

          $chromePaths = @(
            "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "${env:LOCALAPPDATA}\Google\Chrome\Application\chrome.exe"
          )

          $chrome = $chromePaths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if ($chrome) {
            Write-Host "Chrome already installed."
            Write-Host "Path: $chrome"
          }
          else {
            Write-Host "Chrome not found."
            Write-Host "Installing Google Chrome..."

            choco install googlechrome -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: Chrome installation failed."
              exit $LASTEXITCODE
            }
          }

          Write-Host ""
          Write-Host "Chrome installation verified."

      # ============================================================
      # 04 - VERIFY CI ENVIRONMENT
      # ============================================================
      - name: "04 - Verify CI environment"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " CI ENVIRONMENT"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "OS:"
          (Get-CimInstance Win32_OperatingSystem).Caption

          Write-Host ""
          Write-Host "Python:"
          python --version

          Write-Host ""
          Write-Host "Pip:"
          python -m pip --version

          Write-Host ""
          Write-Host "Chrome:"

          $chromePaths = @(
            "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "${env:LOCALAPPDATA}\Google\Chrome\Application\chrome.exe"
          )

          $chrome = $chromePaths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $chrome) {
            Write-Host "ERROR: Chrome executable was not found."
            exit 1
          }

          $chromeVersion = (Get-Item $chrome).VersionInfo.ProductVersion

          Write-Host "Path   : $chrome"
          Write-Host "Version: $chromeVersion"

          Write-Host ""
          Write-Host "Working directory:"
          Get-Location

      # ============================================================
      # 05 - UPGRADE PIP
      # ============================================================
      - name: "05 - Upgrade pip"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " PYTHON PACKAGE MANAGER"
          Write-Host "============================================================"
          Write-Host ""

          python -m pip install --upgrade pip `
            --disable-pip-version-check `
            --quiet

          Write-Host "pip ready."

      # ============================================================
      # 06 - INSTALL REQUIREMENTS
      # ============================================================
      - name: "06 - Install Python requirements"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " PYTHON DEPENDENCIES"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (Test-Path "requirements.txt")) {
            Write-Host "ERROR: requirements.txt was not found."
            exit 1
          }

          Write-Host "Installing requirements.txt..."
          Write-Host ""

          python -m pip install `
            -r requirements.txt `
            --disable-pip-version-check `
            --no-warn-script-location `
            --quiet

          if ($LASTEXITCODE -ne 0) {
            Write-Host ""
            Write-Host "ERROR: Dependency installation failed."
            exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "Dependencies installed successfully."

      # ============================================================
      # 07 - VERIFY TEST STACK
      # ============================================================
      - name: "07 - Verify test stack"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " TEST STACK"
          Write-Host "============================================================"
          Write-Host ""

          python -c "import pytest; print('pytest       :', pytest.__version__)"
          python -c "import selenium; print('selenium      :', selenium.__version__)"
          python -c "import allure; print('allure-pytest : installed')"
          python -c "import yaml; print('PyYAML        :', yaml.__version__)"

          Write-Host ""
          Write-Host "Test stack verified."

      # ============================================================
      # 08 - INSTALL ALLURE CLI
      # ============================================================
      - name: "08 - Install Allure CLI"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " ALLURE"
          Write-Host "============================================================"
          Write-Host ""

          npm install -g allure-commandline --silent

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Allure CLI installation failed."
            exit $LASTEXITCODE
          }

          Write-Host "Allure version:"
          allure --version

      # ============================================================
      # 09 - PREPARE DIRECTORIES
      # ============================================================
      - name: "09 - Prepare test directories"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " TEST DIRECTORIES"
          Write-Host "============================================================"
          Write-Host ""

          New-Item -ItemType Directory -Force `
            -Path "reports/allure-results" | Out-Null

          New-Item -ItemType Directory -Force `
            -Path "reports/allure-report" | Out-Null

          New-Item -ItemType Directory -Force `
            -Path "artifacts" | Out-Null

          Write-Host "Allure results : READY"
          Write-Host "Allure report  : READY"
          Write-Host "Test artifacts : READY"

      # ============================================================
      # 10 - RUN SELENIUM TESTS
      # ============================================================
      - name: "10 - Run Chrome headless tests"
        id: pytest
        shell: powershell
        continue-on-error: true
        env:
          CI: "true"
          TEST_ENV: "test"
          PYTHONUNBUFFERED: "1"
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " SELENIUM TEST RUN"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Framework    : Selenium + Pytest"
          Write-Host "Browser      : Google Chrome"
          Write-Host "Mode         : HEADLESS"
          Write-Host "Environment  : TEST"
          Write-Host "Tests        : src/tests"
          Write-Host "Allure       : reports/allure-results"
          Write-Host "Driver       : Selenium Manager"
          Write-Host ""
          Write-Host "------------------------------------------------------------"
          Write-Host " PYTEST"
          Write-Host "------------------------------------------------------------"
          Write-Host ""

          python -m pytest src/tests `
            --browser=chrome `
            --headless `
            --env=test `
            --alluredir=reports/allure-results `
            --clean-alluredir `
            -ra

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "------------------------------------------------------------"

          if ($exitCode -eq 0) {
            Write-Host "RESULT: ALL TESTS PASSED"
          }
          else {
            Write-Host "RESULT: TESTS FAILED"
            Write-Host "Pytest exit code: $exitCode"
          }

          Write-Host "------------------------------------------------------------"

          # Keep the workflow alive so Allure/artifacts can be generated.
          exit 0

      # ============================================================
      # 11 - GENERATE ALLURE REPORT
      # ============================================================
      - name: "11 - Generate Allure HTML report"
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " GENERATING ALLURE REPORT"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (Test-Path "reports/allure-results")) {
            Write-Host "No Allure results directory found."
            exit 0
          }

          $resultFiles = Get-ChildItem `
            "reports/allure-results" `
            -File `
            -ErrorAction SilentlyContinue

          Write-Host "Result files: $($resultFiles.Count)"

          if ($resultFiles.Count -eq 0) {
            Write-Host "No Allure results were generated."
            exit 0
          }

          Write-Host ""
          Write-Host "Generating HTML..."

          allure generate `
            reports/allure-results `
            --clean `
            -o reports/allure-report

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Allure generation failed."
            exit 1
          }

          if (-not (Test-Path "reports/allure-report/index.html")) {
            Write-Host "ERROR: Allure index.html was not generated."
            exit 1
          }

          Write-Host ""
          Write-Host "Allure report generated."
          Write-Host "HTML: reports/allure-report/index.html"

      # ============================================================
      # 12 - UPLOAD COMPLETE ALLURE REPORT
      # ============================================================
      - name: "12 - Upload complete Allure report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      # ============================================================
      # 13 - UPLOAD RAW ALLURE RESULTS
      # ============================================================
      - name: "13 - Upload Allure results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      # ============================================================
      # 14 - UPLOAD SCREENSHOTS / VIDEO / LOGS
      # ============================================================
      - name: "14 - Upload test artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      # ============================================================
      # 15 - PREPARE GITHUB PAGES
      # ============================================================
      - name: "15 - Upload Allure report to Pages"
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/allure-report

      # ============================================================
      # 16 - DEPLOY ALLURE TO GITHUB PAGES
      # ============================================================
      - name: "16 - Deploy Allure report to GitHub Pages"
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      # ============================================================
      # 17 - FINAL SUMMARY
      # ============================================================
      - name: "17 - CI summary"
        if: always()
        shell: powershell
        env:
          ALLURE_URL: ${{ steps.deployment.outputs.page_url }}
          TEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " CI TEST RUN COMPLETE"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Framework   : Selenium + Pytest"
          Write-Host "Browser     : Google Chrome"
          Write-Host "Mode        : HEADLESS"
          Write-Host "Environment : TEST"
          Write-Host ""

          Write-Host "Test result : $env:TEST_OUTCOME"
          Write-Host ""

          Write-Host "Artifacts:"
          Write-Host "  - allure-report"
          Write-Host "  - allure-results"
          Write-Host "  - test-artifacts"
          Write-Host ""

          if ($env:ALLURE_URL) {
            Write-Host "============================================================"
            Write-Host " ALLURE REPORT"
            Write-Host "============================================================"
            Write-Host ""
            Write-Host $env:ALLURE_URL
            Write-Host ""
          }

          Write-Host "============================================================"

      # ============================================================
      # 18 - FAIL JOB IF TESTS FAILED
      # ============================================================
      - name: "18 - Set final test status"
        if: always()
        shell: powershell
        env:
          TEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          if ($env:TEST_OUTCOME -ne "success") {
            Write-Host ""
            Write-Host "============================================================"
            Write-Host " TESTS FAILED"
            Write-Host "============================================================"
            Write-Host ""
            exit 1
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host " ALL TESTS PASSED"
          Write-Host "============================================================"
