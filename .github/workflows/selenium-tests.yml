name: Selenium Pytest Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Required to allow GitHub Actions to push the Allure report to the gh-pages branch
permissions:
  contents: write

jobs:
  selenium-tests:
    name: Chrome Headed Selenium Tests
    runs-on: windows-latest

    steps:
      # 01 - Checkout
      - name: "01 - Checkout repository"
        uses: actions/checkout@v4

      # 02 - Python (Cache will now work because requirements.txt won't be modified mid-run)
      - name: "02 - Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 03 - Environment info
      - name: "03 - Verify CI environment"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " CI ENVIRONMENT"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Operating System:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version |
            Format-List

          Write-Host "Python:"
          python --version

          Write-Host "Pip:"
          python -m pip --version

          Write-Host "Chrome:"
          $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (Test-Path $chromePath) {
            & $chromePath --version
          } else {
            Write-Host "Chrome not found at default path, skipping version check."
          }

          Write-Host ""
          Write-Host "Working directory:"
          Get-Location

      # 04 - Upgrade pip
      - name: "04 - Upgrade pip"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " UPGRADING PIP"
          Write-Host "============================================================"
          Write-Host ""

          python -m pip install `
            --upgrade pip `
            --disable-pip-version-check

      # 05 - Install Python requirements (Removed dynamic patch)
      - name: "05 - Install Python requirements"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " INSTALLING PYTHON REQUIREMENTS"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (Test-Path "requirements.txt")) {
            Write-Host "ERROR: requirements.txt was not found."
            exit 1
          }

          Write-Host "Installing requirements.txt..."
          Write-Host ""

          python -m pip install `
            -r requirements.txt `
            --disable-pip-version-check `
            --no-warn-script-location

          if ($LASTEXITCODE -ne 0) {
            Write-Host ""
            Write-Host "ERROR: Python dependency installation failed."
            exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "Python dependencies installed successfully."

      # 06 - Verify test stack
      - name: "06 - Verify test stack"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " TEST STACK"
          Write-Host "============================================================"
          Write-Host ""

          python -c "import pytest; print('pytest        :', pytest.__version__)"
          python -c "import selenium; print('selenium       :', selenium.__version__)"
          python -c "import allure; print('allure-pytest  : installed')"
          python -c "import yaml; print('PyYAML         :', yaml.__version__)"

          Write-Host ""
          Write-Host "Python test stack verified."

      # 07 - Install Allure CLI
      - name: "07 - Install Allure CLI"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " INSTALLING ALLURE CLI (via NPM)"
          Write-Host "============================================================"
          Write-Host ""

          npm install -g allure-commandline

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Allure installation failed."
            exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "Allure version:"
          allure --version

      # 08 - Prepare directories
      - name: "08 - Prepare test directories"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " PREPARING TEST DIRECTORIES"
          Write-Host "============================================================"
          Write-Host ""

          New-Item -ItemType Directory -Force -Path "reports/allure-results" | Out-Null
          New-Item -ItemType Directory -Force -Path "reports/allure-report" | Out-Null
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null

          Write-Host "reports/allure-results : READY"
          Write-Host "reports/allure-report  : READY"
          Write-Host "artifacts              : READY"

      # 09 - Run Selenium tests (Headed mode)
      - name: "09 - Run Chrome headed tests"
        shell: powershell
        env:
          CI: "true"
          TEST_ENV: "test"
          PYTHONUNBUFFERED: "1"
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " RUNNING SELENIUM TESTS"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Framework     : Selenium + Pytest"
          Write-Host "Browser       : Google Chrome"
          Write-Host "Mode          : HEADED (CI)"
          Write-Host "Environment   : TEST"
          Write-Host "Test path     : src/tests"
          Write-Host "Allure output : reports/allure-results"
          Write-Host ""
          Write-Host "ChromeDriver  : Selenium Manager"
          Write-Host ""
          Write-Host "------------------------------------------------------------"
          Write-Host " PYTEST OUTPUT"
          Write-Host "------------------------------------------------------------"
          Write-Host ""

          python -m pytest src/tests `
            --browser=chrome `
            --env=test `
            --alluredir=reports/allure-results `
            --clean-alluredir `
            -ra

          $testExitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "------------------------------------------------------------"

          if ($testExitCode -eq 0) {
            Write-Host " TEST RESULT: PASSED"
          }
          else {
            Write-Host " TEST RESULT: FAILED"
            Write-Host " Pytest exit code: $testExitCode"
          }

          Write-Host "------------------------------------------------------------"
          Write-Host ""

          exit $testExitCode

      # 10 - Generate Allure HTML report
      - name: "10 - Generate Allure HTML report"
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " GENERATING ALLURE REPORT"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (Test-Path "reports/allure-results")) {
            Write-Host "WARNING: Allure results directory does not exist."
            exit 0
          }

          allure generate reports/allure-results --clean -o reports/allure-report

      # 11 - Upload Allure HTML report
      - name: "11 - Upload Allure HTML report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report
          if-no-files-found: warn
          retention-days: 14

      # 12 - Deploy Allure Report to GitHub Pages
      - name: "12 - Deploy Allure report to GitHub Pages"
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports/allure-report
          publish_branch: gh-pages
          keep_files: false
