name: Selenium Pytest Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  selenium-tests:
    name: Selenium Tests - Chrome Headless
    runs-on: windows-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # --------------------------------------------------
      # 3. Show Python / Chrome versions
      # --------------------------------------------------
      - name: Verify environment
        shell: powershell
        run: |
          python --version
          python -m pip --version
          chrome --version

      # --------------------------------------------------
      # 4. Upgrade pip
      # --------------------------------------------------
      - name: Upgrade pip
        shell: powershell
        run: |
          python -m pip install --upgrade pip

      # --------------------------------------------------
      # 5. Install ALL Python dependencies
      # --------------------------------------------------
      - name: Install requirements
        shell: powershell
        run: |
          python -m pip install -r requirements.txt

      # --------------------------------------------------
      # 6. Install Allure CLI
      # --------------------------------------------------
      - name: Install Allure CLI
        shell: powershell
        run: |
          choco install allure -y

      # Verify Allure installation
      - name: Verify Allure
        shell: powershell
        run: |
          allure --version

      # --------------------------------------------------
      # 7. Create report directories
      # --------------------------------------------------
      - name: Prepare report directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "reports/allure-results"
          New-Item -ItemType Directory -Force -Path "reports/allure-report"

      # --------------------------------------------------
      # 8. Run Selenium + Pytest
      # --------------------------------------------------
      - name: Run Chrome headless tests
        shell: powershell
        env:
          CI: "true"
          TEST_ENV: "test"
          PYTHONUNBUFFERED: "1"
        run: |
          python -m pytest src/tests `
            --browser=chrome `
            --headless `
            --env=test `
            --alluredir=reports/allure-results `
            --clean-alluredir

      # --------------------------------------------------
      # 9. Generate Allure HTML report
      # --------------------------------------------------
      - name: Generate Allure report
        if: always()
        shell: powershell
        run: |
          if (Test-Path "reports/allure-results") {
            allure generate `
              reports/allure-results `
              --clean `
              -o reports/allure-report
          }

      # --------------------------------------------------
      # 10. Upload Allure HTML report
      # --------------------------------------------------
      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report
          if-no-files-found: warn
          retention-days: 14

      # --------------------------------------------------
      # 11. Upload raw Allure results
      # --------------------------------------------------
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results
          if-no-files-found: warn
          retention-days: 14

      # --------------------------------------------------
      # 12. Upload screenshots / videos / logs
      # --------------------------------------------------
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
