```yaml
name: Selenium Pytest Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  selenium-tests:
    name: Chrome Headless Selenium Tests
    runs-on: windows-latest

    steps:

      # ============================================================
      # 01 - CHECKOUT
      # ============================================================
      - name: "01 - Checkout repository"
        uses: actions/checkout@v4

      # ============================================================
      # 02 - PYTHON
      # ============================================================
      - name: "02 - Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ============================================================
      # 03 - VERIFY ENVIRONMENT
      # ============================================================
      - name: "03 - Verify CI environment"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " CI ENVIRONMENT"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Operating System:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version |
            Format-List

          Write-Host "Python:"
          python --version

          Write-Host "Pip:"
          python -m pip --version

          Write-Host ""
          Write-Host "Chrome detection:"

          $chromePaths = @(
            "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "${env:LOCALAPPDATA}\Google\Chrome\Application\chrome.exe"
          )

          $chromeFound = $false

          foreach ($path in $chromePaths) {
            if (Test-Path $path) {
              Write-Host "Chrome found:"
              Write-Host "  $path"

              $version = (Get-Item $path).VersionInfo.ProductVersion
              Write-Host "Chrome version:"
              Write-Host "  $version"

              $chromeFound = $true
              break
            }
          }

          if (-not $chromeFound) {
            Write-Host "Chrome executable was not found in the standard locations."
            Write-Host "Selenium Manager will attempt to resolve the browser/driver."
          }

          Write-Host ""
          Write-Host "Working directory:"
          Get-Location

      # ============================================================
      # 04 - UPGRADE PIP
      # ============================================================
      - name: "04 - Upgrade pip"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " UPGRADING PIP"
          Write-Host "============================================================"
          Write-Host ""

          python -m pip install --upgrade pip --disable-pip-version-check

      # ============================================================
      # 05 - INSTALL REQUIREMENTS
      # ============================================================
      - name: "05 - Install Python requirements"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " INSTALLING PYTHON REQUIREMENTS"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (Test-Path "requirements.txt")) {
            Write-Host "ERROR: requirements.txt was not found."
            exit 1
          }

          Write-Host "Installing:"
          Write-Host "  requirements.txt"
          Write-Host ""

          python -m pip install `
            -r requirements.txt `
            --disable-pip-version-check `
            --no-warn-script-location

          if ($LASTEXITCODE -ne 0) {
            Write-Host ""
            Write-Host "ERROR: Python dependency installation failed."
            exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "Python dependencies installed successfully."

      # ============================================================
      # 06 - VERIFY PYTHON TEST STACK
      # ============================================================
      - name: "06 - Verify test stack"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " TEST STACK"
          Write-Host "============================================================"
          Write-Host ""

          python -c "import pytest; print('pytest        :', pytest.__version__)"
          python -c "import selenium; print('selenium       :', selenium.__version__)"
          python -c "import allure; print('allure-pytest  : installed')"
          python -c "import yaml; print('PyYAML         :', yaml.__version__)"

          Write-Host ""
          Write-Host "Python package installation verified."

      # ============================================================
      # 07 - INSTALL ALLURE CLI
      # ============================================================
      - name: "07 - Install Allure CLI"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " INSTALLING ALLURE CLI"
          Write-Host "============================================================"
          Write-Host ""

          choco install allure -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Allure installation failed."
            exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "Allure version:"
          allure --version

      # ============================================================
      # 08 - PREPARE DIRECTORIES
      # ============================================================
      - name: "08 - Prepare test directories"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " PREPARING TEST DIRECTORIES"
          Write-Host "============================================================"
          Write-Host ""

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "reports/allure-results" | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "reports/allure-report" | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "artifacts" | Out-Null

          Write-Host "reports/allure-results : READY"
          Write-Host "reports/allure-report  : READY"
          Write-Host "artifacts              : READY"

      # ============================================================
      # 09 - RUN SELENIUM TESTS
      # ============================================================
      - name: "09 - Run Chrome headless tests"
        shell: powershell
        env:
          CI: "true"
          TEST_ENV: "test"
          PYTHONUNBUFFERED: "1"
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " RUNNING SELENIUM TESTS"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Browser       : Chrome"
          Write-Host "Mode          : Headless"
          Write-Host "Environment   : TEST"
          Write-Host "Test path     : src/tests"
          Write-Host "Allure output : reports/allure-results"
          Write-Host ""
          Write-Host "Selenium Manager will handle ChromeDriver."
          Write-Host ""
          Write-Host "------------------------------------------------------------"
          Write-Host " PYTEST OUTPUT"
          Write-Host "------------------------------------------------------------"
          Write-Host ""

          python -m pytest src/tests `
            --browser=chrome `
            --headless `
            --env=test `
            --alluredir=reports/allure-results `
            --clean-alluredir `
            -ra

          $testExitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "------------------------------------------------------------"

          if ($testExitCode -eq 0) {
            Write-Host " TEST RESULT: PASSED"
          }
          else {
            Write-Host " TEST RESULT: FAILED"
            Write-Host " Pytest exit code: $testExitCode"
          }

          Write-Host "------------------------------------------------------------"
          Write-Host ""

          exit $testExitCode

      # ============================================================
      # 10 - GENERATE ALLURE REPORT
      # ============================================================
      - name: "10 - Generate Allure HTML report"
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " GENERATING ALLURE REPORT"
          Write-Host "============================================================"
          Write-Host ""

          if (-not (Test-Path "reports/allure-results")) {
            Write-Host "WARNING: Allure results directory does not exist."
            exit 0
          }

          $resultFiles = Get-ChildItem `
            "reports/allure-results" `
            -File `
            -ErrorAction SilentlyContinue

          Write-Host "Allure result files: $($resultFiles.Count)"
          Write-Host ""

          if ($resultFiles.Count -eq 0) {
            Write-Host "WARNING: No Allure result files were generated."
            exit 0
          }

          Write-Host "Generating HTML report..."
          Write-Host ""

          allure generate `
            reports/allure-results `
            --clean `
            -o reports/allure-report

          if ($LASTEXITCODE -ne 0) {
            Write-Host "WARNING: Allure report generation failed."
            exit 0
          }

          Write-Host ""
          Write-Host "Allure report generated successfully."
          Write-Host "Location: reports/allure-report/index.html"

      # ============================================================
      # 11 - INSPECT REPORTS
      # ============================================================
      - name: "11 - Inspect generated files"
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " GENERATED FILES"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Allure results:"
          if (Test-Path "reports/allure-results") {
            $count = (Get-ChildItem "reports/allure-results" -File).Count
            Write-Host "  Files: $count"
          }
          else {
            Write-Host "  Directory not found"
          }

          Write-Host ""
          Write-Host "Allure HTML report:"
          if (Test-Path "reports/allure-report") {
            $count = (Get-ChildItem "reports/allure-report" -Recurse -File).Count
            Write-Host "  Files: $count"

            if (Test-Path "reports/allure-report/index.html") {
              Write-Host "  index.html: FOUND"
            }
          }
          else {
            Write-Host "  Directory not found"
          }

          Write-Host ""
          Write-Host "Test artifacts:"
          if (Test-Path "artifacts") {
            $count = (Get-ChildItem "artifacts" -Recurse -File).Count
            Write-Host "  Files: $count"
          }
          else {
            Write-Host "  Directory not found"
          }

      # ============================================================
      # 12 - UPLOAD ALLURE HTML REPORT
      # ============================================================
      - name: "12 - Upload Allure HTML report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 13 - UPLOAD RAW ALLURE RESULTS
      # ============================================================
      - name: "13 - Upload Allure results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 14 - UPLOAD SCREENSHOTS / VIDEO / LOGS
      # ============================================================
      - name: "14 - Upload test artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 15 - FINAL SUMMARY
      # ============================================================
      - name: "15 - CI summary"
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " CI TEST RUN COMPLETE"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Framework   : Selenium + Pytest"
          Write-Host "Browser     : Chrome"
          Write-Host "Mode        : Headless"
          Write-Host "Environment : TEST"
          Write-Host ""
          Write-Host "Artifacts:"
          Write-Host "  - allure-report"
          Write-Host "  - allure-results"
          Write-Host "  - test-artifacts"
          Write-Host ""
          Write-Host "Allure report:"
          Write-Host "  reports/allure-report/index.html"
          Write-Host ""
          Write-Host "============================================================"
```
